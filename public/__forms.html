<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Form detection</title></head>
<body>
  <!--
    This page exists only so Netlify's build-time bot can detect our forms.
    Next.js pages are not written out as static HTML at deploy time (since any
    page can be revalidated at runtime), so Netlify can't find <form
    data-netlify> tags inside app/components/ResidentialLeadForm.jsx or
    Walkthrough.jsx directly. This plain, unbuilt HTML file fills that gap.
    Nobody ever sees this page — the real forms live on the actual site and
    submit to these same form names via fetch().
    See: https://ntl.fyi/next-runtime-forms-migration
  -->

  <form name="residential-lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="residential-lead" />
    <input type="hidden" name="subject" value="New Residential Lead Form" />
    <input name="bot-field" />
    <input name="name" />
    <input name="phone" />
    <input name="email" />
    <input name="address" />
    <input name="clean-type" />
    <input name="frequency" />
    <input name="bedrooms" />
    <input name="bathrooms" />
    <input name="sqft" />
    <input name="date" />
    <textarea name="notes"></textarea>
  </form>

  <form name="commercial-walkthrough" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="commercial-walkthrough" />
    <input type="hidden" name="subject" value="New Commercial Lead Form" />
    <input name="bot-field" />
    <input name="business" />
    <input name="name" />
    <input name="contact" />
    <input name="sqft" />
    <input name="address" />
    <input name="date" />
    <input name="facility-type" />
    <input name="frequency" />
    <input name="reason" />
    <input name="timeline" />
    <input name="notes" />
  </form>
</body>
</html>
